name: Run melody progression patch
on:
  push:
    paths:
      - '.github/workflows/run-melody-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_melody.py
      - run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/app.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])"
          node --check /tmp/app.js
      - run: |
          git config user.name "regelus19"
          git config user.email "47474147+regelus19@users.noreply.github.com"
          git add index.html
          git commit -m "Restore melody-scored progression engine"
          git push
